<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/manage_groups.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/group.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" type="image/png" href="/static/images/icon-192x192.png">
  <title>Admin Settings</title>
</head>
<body>
  {% set active_sidebar = 'settings' %}

  <div class="admin-layout">
    {% include '_admin_sidebar.html' %}

    <div class="admin-content">
      <div class="head">
        <h1 class="text">Admin Settings</h1>
        <p>Academic Year: <strong>{{ year }}</strong></p>
        {% if error %}
          <p class="error">{{ error }}</p>
        {% endif %}
        {% if success %}
          <p class="success">{{ success }}</p>
        {% endif %}
        {% if message %}
          <p class="success">{{ message }}</p>
        {% endif %}
      </div>

      <main>

        <!-- ===== CHANGE ADMIN PASSWORD ===== -->
        <div class="help-container" id="password_change">
          <h2>Change Admin Password</h2>
          <form method="POST" action="/admin/change_password">
            <label for="current_password">Current Password</label>
            <div class="password-container">
              <input type="password" name="current_password" id="current_password" required>
              <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                <svg class="eye-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
              </button>
            </div>

            <label for="new_password">New Password</label>
            <div class="password-container">
              <input type="password" name="new_password" id="new_password" required minlength="6">
              <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                <svg class="eye-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
              </button>
            </div>

            <label for="confirm_password">Confirm New Password</label>
            <div class="password-container">
              <input type="password" name="confirm_password" id="confirm_password" required minlength="6">
              <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                <svg class="eye-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
              </button>
            </div>

            <button type="submit" class="btn">Update Password</button>
          </form>
        </div>

      </main>

      <script>
        const eyePath = "M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z";
        const eyeSlashPath = "M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.74-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z";

        document.querySelectorAll('.toggle-password').forEach(button => {
          button.addEventListener('click', function() {
            const input = this.closest('.password-container').querySelector('input');
            const path = this.querySelector('path');
            if (input.type === 'password') {
              input.type = 'text';
              path.setAttribute('d', eyeSlashPath);
            } else {
              input.type = 'password';
              path.setAttribute('d', eyePath);
            }
          });
        });
      </script>
    </div>
  </div>
</body>
</html>
