<a class="notif-link" id="notifLink" href="/notifications" aria-label="Notifications">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
  </svg>
  <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
</a>

<script>
(function() {
  var badge = document.getElementById('notifBadge');
  var localReadKey = 'ecofield_read_notifications';

  if (!badge) return;

  function updateBadge() {
    fetch('/api/notifications?limit=50', { cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var notifs = data.notifications || [];
        var localReadIds = getLocalReadIds();
        var unread = 0;

        notifs.forEach(function(n) {
          if (!n.read && localReadIds.indexOf(String(n.id)) === -1) {
            unread++;
          }
        });

        if (unread > 0) {
          badge.textContent = unread;
          badge.style.display = 'flex';
        } else {
          badge.style.display = 'none';
        }
      })
      .catch(function() {});
  }

  function getLocalReadIds() {
    try {
      return JSON.parse(localStorage.getItem(localReadKey) || '[]');
    } catch (e) {
      return [];
    }
  }

  updateBadge();
})();
</script>
